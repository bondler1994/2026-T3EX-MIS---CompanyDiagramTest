<f-flow fDraggable>
  <f-canvas [fZoom]="isZoomEnabled">
    <!-- test this shit -->
    @for(connection of connections(); track connection.id){
    <f-connection
      [fOffset]="4"
      [fOutputId]="connection.from"
      [fInputId]="connection.to"
      fType="segment"
      fBehavior="fixed"
    ></f-connection>
    }@for(node of nodes();track node.id){

    <div
      class="company company__title node"
      fNode
      [fNodePosition]="node.position"
      fDragHandle
      fNodeInput
      [fInputId]="node.connectorId"
      [fInputConnectableSide]="configuration().inputSide"
      (dblclick)="startEdit(node.id)"
      (click)="$event.stopPropagation()"
    >
      @if(editingNodeId() === node.id){
      <input
        #editInput
        [(ngModel)]="editingNodeTitle"
        (blur)="finishEdit()"
        (keydown)="onEditInputKeydown($event)"
        class="border border-r-2 rounded-lg p-2"
      />
      } @else {
      <span>{{ node.title }}</span>
      }

      <div
        fNodeOutput
        [fOutputId]="node.connectorId"
        [fOutputConnectableSide]="configuration().outputSide"
        [ngClass]="configuration().outputSide"
      ></div>

      <div class="node__controls">
        <button
          class="node__button-add"
          (click)="addChildNode(node.connectorId); $event.stopPropagation()"
          title="Add child node"
        >
          <span>+</span>
        </button>
        @if (!isRootNode(node.connectorId)) {
        <button
          class="node__button-remove"
          (click)="removeNode(node.connectorId); $event.stopPropagation()"
          title="Remove node"
        >
          <span>-</span>
        </button>
        }
      </div>
    </div>

    }
  </f-canvas>
</f-flow>

<div class="absolute top-10 right-10 flex gap-3">
  <button class="f-button bg-slate-400 p-3" (click)="horizontal()">
    Horizontal
  </button>
  <button class="f-button bg-slate-400 p-3" (click)="vertical()">
    Vertical
  </button>
</div>
